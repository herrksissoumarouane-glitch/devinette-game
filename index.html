<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devinette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-gray-800 flex items-center justify-center p-4">

  <div class="bg-white/10 backdrop-blur-xl p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md 
              border border-white/20 animate-fadeIn">

    <h1 class="text-center text-white text-3xl font-bold mb-2">Jeu de Devinette</h1>
    <p class="text-center text-blue-200 mb-4">Trouvez un nombre entre <b>10</b> et <b>100</b></p>

    <p class="text-center text-blue-300">Essais restants : 
      <span id="essai" class="text-yellow-300 font-bold">10</span>
    </p>

    <div class="mt-6">
      <label class="text-white block mb-2">Votre choix :</label>
      <input id="choix" type="text"
        class="w-full px-4 py-2 rounded-lg bg-white/20 text-white outline-none 
               focus:ring-2 focus:ring-blue-400 transition placeholder-gray-300"
        placeholder="Entrez un nombre..." />
    </div>

    <button onclick="Essai()"
      class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg 
             transition font-semibold shadow-lg hover:scale-[1.03] active:scale-95">
      Essayer
    </button>

    <button onclick="showHistory()"
      class="w-full mt-3 bg-gray-700 hover:bg-gray-800 text-gray-200 py-2 rounded-lg 
             transition shadow-md hover:scale-[1.02] active:scale-95">
      Voir l’historique
    </button>

    <p id="msg" class="text-center mt-4 text-lg font-semibold h-10 text-white"></p>

    <div id="historyBox"
         class="hidden mt-4 p-3 bg-white/10 rounded-lg text-white text-sm border border-white/10 
                animate-slideUp">
    </div>

  </div>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-slideUp {
      animation: slideUp 0.4s ease-out;
    }
  </style>

</body>
</html>
